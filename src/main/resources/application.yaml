spring:
  application:
    name: hotel-host-project-backend
  # En local las variables salen del .env; en producción, de las variables de entorno del servidor
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Las tablas las crea Flyway (db/migration); Hibernate solo comprueba que coinciden
      ddl-auto: validate
    open-in-view: false
    properties:
      # Carga en bloque las relaciones LAZY (camas, checklist...) de muchas entidades a la vez, en vez de una consulta por cada una
      hibernate.default_batch_fetch_size: 50

server:
  port: ${SERVER_PORT:8081}

springdoc:
  # Documentación solo de nuestra API: /swagger-ui.html y /v3/api-docs
  paths-to-match: /api/**

app:
  cors:
    # Orígenes del frontend que pueden llamar a la API, separados por comas
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    # Clave para firmar los tokens: mínimo 32 caracteres
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  admin:
    # Admin inicial: se crea al arrancar solo si todavía no existe ningún administrador
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
