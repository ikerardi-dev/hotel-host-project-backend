# Base de datos MySQL para desarrollo local. Arrancar con: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: hotel-host-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Scripts de la primera arrancada: crea también la base de datos de los tests
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql-data:
